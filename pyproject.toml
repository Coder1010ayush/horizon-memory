[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-memory"
version = "0.1.0"
description = "The memory layer that understands your data — unified knowledge base + agent context SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ayush", email = "developer.zang.000@gmail.com"}
]
keywords = ["memory", "rag", "knowledge-graph", "ai", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "anyio>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
local = [
    "lancedb>=0.4.0",
    "kuzu>=0.3.0",
    "sentence-transformers>=2.5.0",
    "spacy>=3.7.0",
]
production = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "neo4j>=5.15.0",
]
all = ["horizon-memory[dev,local,production]"]

[project.urls]
Homepage = "https://github.com/horizon-memory/horizon"
Repository = "https://github.com/horizon-memory/horizon"

[project.scripts]
horizon = "horizon.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["horizon"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
